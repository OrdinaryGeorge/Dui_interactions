<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #080a1e 0%, #04050d 70%, #000 100%);
            overflow: hidden;
            font-family: sans-serif;
            animation: nebula 18s ease-in-out infinite;
            background-size: 140% 140%;
        }

        .ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 4px solid rgba(80, 200, 255, 0.4);
            box-shadow: 0 0 50px rgba(80, 200, 255, 0.3);
            animation: idleOrbit 8s linear infinite, ringGlow 6.5s ease-in-out infinite;
        }

        .ring:nth-child(2) {
            width: 180px;
            height: 180px;
            border-color: rgba(255, 120, 180, 0.5);
            box-shadow: 0 0 35px rgba(255, 120, 180, 0.25);
            animation-duration: 6s, 10s;
        }

        .ring:nth-child(3) {
            width: 120px;
            height: 120px;
            border-color: rgba(120, 255, 180, 0.6);
            box-shadow: 0 0 25px rgba(120, 255, 180, 0.25);
            animation-duration: 4s, 8s;
        }

        .core {
            position: relative;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(120, 200, 255, 0.05) 70%);
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(160, 230, 255, 0.9);
            animation: pulse 2.5s ease-in-out infinite, coreFlicker 7s ease-in-out infinite;
        }

        .glow {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.9), 0 0 80px rgba(80, 200, 255, 0.4);
            animation: blink 1.8s ease-in-out infinite, glowDrift 5.5s ease-in-out infinite;
        }

        @keyframes idleOrbit {
            0% { transform: rotate(0deg) scale(1) translate(0, 0); }
            20% { transform: rotate(72deg) scale(1.02) translate(32px, -22px); }
            40% { transform: rotate(144deg) scale(0.98) translate(-28px, 26px); }
            60% { transform: rotate(216deg) scale(1.01) translate(26px, 32px); }
            80% { transform: rotate(288deg) scale(1.00) translate(-30px, -18px); }
            100% { transform: rotate(360deg) scale(1) translate(0, 0); }
        }

        @keyframes ringGlow {
            0%, 100% { filter: drop-shadow(0 0 40px rgba(80, 200, 255, 0.25)); }
            50% { filter: drop-shadow(0 0 70px rgba(150, 230, 255, 0.35)); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes coreFlicker {
            0%, 100% { box-shadow: 0 0 35px rgba(160, 230, 255, 0.9); }
            50% { box-shadow: 0 0 55px rgba(180, 255, 255, 0.95); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes glowDrift {
            0% { box-shadow: 0 0 22px rgba(255, 255, 255, 0.9), 0 0 80px rgba(80, 200, 255, 0.4); }
            50% { box-shadow: 0 0 28px rgba(255, 255, 255, 1), 0 0 95px rgba(120, 240, 255, 0.5); }
            100% { box-shadow: 0 0 22px rgba(255, 255, 255, 0.9), 0 0 80px rgba(80, 200, 255, 0.4); }
        }

        @keyframes nebula {
            0%, 100% { background-position: center 40%; }
            50% { background-position: center 60%; }
        }
    </style>
</head>
<body>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core">
        <div class="glow"></div>
    </div>
</body>
</html>
